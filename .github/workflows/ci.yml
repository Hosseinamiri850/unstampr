name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    # The production build must not depend on a developer's .env: these are the
    # same fallbacks src/lib/env.ts uses, pinned so CI is deterministic.
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_PAYMENTS_ENABLED: 'false'
      SESSION_SECRET: ci-only-not-a-real-secret-please-change-in-prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      # Catches what typecheck/lint cannot: missing translation keys, bad
      # server/client boundaries, prerender errors, broken imports.
      - run: npm run build

  worker:
    name: Worker (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - run: pip install -r worker/requirements.txt pytest

      - name: Install FFmpeg
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ffmpeg
          version: 1.0

      - run: python -m pytest worker/tests -q
